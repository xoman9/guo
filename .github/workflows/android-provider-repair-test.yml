name: Android provider repair APK test
on:
  workflow_dispatch:
  push:
    branches:
      - fix/jable-missav-jinguo-cover-20261114
    paths:
      - 'native/**'
      - 'lib/**'
      - 'scripts/**'
      - '.github/workflows/android-provider-repair-test.yml'
permissions:
  contents: read
concurrency:
  group: provider-repair-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      ZHENGUOJIAN_PACKAGE_NAME: com.duanju.coexist
      ZHENGUOJIAN_DISPLAY_NAME: 小果影視-共存版
      ZHENGUOJIAN_LATIN_NAME: XiaoGuo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
          accept-android-sdk-licenses: true
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Verify guo permanent signing identity (original 110 certificate)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            [[ -n "$value" ]] || { echo "::error::Original guo ANDROID signing secret missing"; exit 1; }
          done
          jks="$RUNNER_TEMP/guo-permanent.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$jks"
          keytool -list -v -keystore "$jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/guo-cert.txt"
          actual=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' "$RUNNER_TEMP/guo-cert.txt" | head -n1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          expected=78cf3a09001eba2c5b8e7b169d2af15301e76bf5c442af00c4031120dcb1fd6a
          [[ "$actual" == "$expected" ]] || { echo "::error::guo signing key is not the existing 110 permanent certificate"; exit 1; }
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          {
            echo "ANDROID_KEYSTORE_PATH=$jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build ARM64 and ARMv7 test APKs with custom providers
        run: |
          set -euo pipefail
          python scripts/build_android.py --all-sources --abi arm64-v8a --abi armeabi-v7a --sources native/sources_custom
      - name: Verify APK signing matches existing guo certificate
        run: |
          set -euo pipefail
          expected=78cf3a09001eba2c5b8e7b169d2af15301e76bf5c442af00c4031120dcb1fd6a
          test -n "$expected" || { echo "::error::Missing computed GUO2 signer fingerprint"; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n1)
          test -n "$apksigner"
          shopt -s nullglob
          apks=(dist/android/*.apk)
          test "${#apks[@]}" -ge 2 || { echo "::error::Expected both APK ABIs"; exit 1; }
          for apk in "${apks[@]}"; do
            "$apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/cert-info.txt"
            grep -iF "$expected" <(tr -d ':' < "$RUNNER_TEMP/cert-info.txt" | tr '[:upper:]' '[:lower:]') || {
              echo "::error::Unexpected signing certificate on $apk"; exit 1;
            }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: guo2-provider-repair-signed-test-apks
          path: dist/android/*.apk
          retention-days: 7
          if-no-files-found: error
