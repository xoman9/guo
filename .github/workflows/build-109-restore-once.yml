name: Build restored upstream 1.0.9+109 once - ARM64 and ARMv7
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build-109-restore-once.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guo-upstream-109-restore
  cancel-in-progress: false
jobs:
  build-109:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ZHENGUOJIAN_PACKAGE_NAME: com.duanju.coexist
      ZHENGUOJIAN_DISPLAY_NAME: 小果影視-共存版
      ZHENGUOJIAN_LATIN_NAME: XiaoGuo
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
      EXPECTED_CERT_SHA256: 78cf3a09001eba2c5b8e7b169d2af15301e76bf5c442af00c4031120dcb1fd6a
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact upstream 109 source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version: 1.0.9+109' pubspec.yaml
          test ! -e native/sources_custom
          test ! -e native/sources_legacy109
          test ! -e native/sources_missav
      - name: Require original authorized provider source module
        shell: bash
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCES_DEPLOY_KEY }}
        run: |
          test -n "$SOURCE_DEPLOY_KEY" || {
            echo "::error::Missing SOURCES_DEPLOY_KEY. Refusing to ship demo-only source as original 109."
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.GUO_SOURCE_REPOSITORY || 'Xanerix/guoapp-sources' }}
          ssh-key: ${{ secrets.SOURCES_DEPLOY_KEY }}
          path: guoapp-sources
          persist-credentials: false
      - name: Confirm authorized source module
        run: |
          grep -Eq '^module[[:space:]]+guoapp/sources[[:space:]]*$' guoapp-sources/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
          accept-android-sdk-licenses: true
      - name: Install Android NDK for 109
        shell: bash
        run: |
          set -euo pipefail
          version=28.2.13676358
          if [ ! -f "$ANDROID_HOME/ndk/$version/source.properties" ]; then
            sdkmanager --sdk_root="$ANDROID_HOME" "ndk;$version"
          fi
          grep -q "Pkg.Revision = $version" "$ANDROID_HOME/ndk/$version/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$version" >> "$GITHUB_ENV"
      - name: Validate and load permanent signing key
        shell: bash
        env:
          ORIGINAL_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for val in "$ORIGINAL_KEY" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            test -n "$val" || { echo "::error::Permanent signing secret missing"; exit 1; }
          done
          umask 077
          printf '%s' "$ORIGINAL_KEY" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/guo-109.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/guo-109.jks" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/guo-109.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/guo-109-cert.txt"
          actual=$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/guo-109-cert.txt" | head -n1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$EXPECTED_CERT_SHA256" || { echo "::error::Certificate fingerprint mismatch"; exit 1; }
      - name: Build 109 APK for ARM64 and ARMv7
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python scripts/build_android.py --all-sources --sources guoapp-sources --abi arm64-v8a --abi armeabi-v7a 2>&1 | tee "$RUNNER_TEMP/guo-109-build.log"
      - name: Verify both APKs, signer and architecture
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(dist/android/*arm64-v8a.apk dist/android/*armeabi-v7a.apk)
          test "${#apks[@]}" -eq 2 || { echo "::error::Expected two APKs"; exit 1; }
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n1)
          test -n "$signer" && test -n "$aapt"
          mkdir -p verified
          for apk in "${apks[@]}"; do
            "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/guo-109-apk-cert.txt"
            digest=$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/guo-109-apk-cert.txt" | awk '{print $NF}' | tr -d ': ' | tr '[:upper:]' '[:lower:]')
            test "$digest" = "$EXPECTED_CERT_SHA256" || { echo "::error::APK signer mismatch"; exit 1; }
            "$aapt" dump badging "$apk" | grep -F "package: name='com.duanju.coexist'"
            if [[ "$apk" == *arm64-v8a.apk ]]; then abi=arm64-v8a; else abi=armeabi-v7a; fi
            for lib in libduanju_core.so libflutter.so libapp.so libmpv.so libffmpegkit.so; do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/$lib"
            done
            cp "$apk" verified/
          done
          (cd verified && sha256sum *.apk > SHA256SUMS.txt)
          echo "Original upstream 1.0.9+109, both ABIs, historical signer verified" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: guo-upstream-109-fixed-signer-ARM64-v7a
          path: verified/*
          retention-days: 14
          if-no-files-found: error
      - name: Upload failure log to GitHub
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guo-109-build-failure-log
          path: ${{ runner.temp }}/guo-109-build.log
          if-no-files-found: warn
          retention-days: 14
      - name: Remove signing secrets
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/guo-109.jks" "$RUNNER_TEMP/guo-109-cert.txt" "$RUNNER_TEMP/guo-109-apk-cert.txt"
