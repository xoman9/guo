name: Build experimental 110 coexist with 13 additional native providers
on:
  push:
    branches: [feat/110-coexist-13-real-providers-20261114]
    paths:
      - '.github/workflows/build-110-coexist-consent.yml'
      - 'lib/ui/terms_page.dart'
      - 'lib/ui/widgets/source_bar.dart'
      - 'lib/ui/widgets/choice_panel.dart'
      - 'lib/ui/widgets/page_header.dart'
      - 'lib/models.dart'
      - 'lib/local_store.dart'
      - 'lib/ui/explore/source_actions.dart'
      - 'lib/ui/settings/sources_view.dart'
      - 'lib/ui/shell/app_shell.dart'
      - 'lib/ui/settings/storage_view.dart'
      - 'lib/ui/settings/settings_sections.dart'
      - 'native/**'
      - 'scripts/build_native.py'
      - 'native/core/app_storage.go'
      - 'lib/app_device.dart'
      - 'android/app/src/main/AndroidManifest.xml'
      - 'android/app/src/main/kotlin/com/guoapp/MainActivity.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guo-110-coexist-13-provider-experiment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ZHENGUOJIAN_PACKAGE_NAME: com.duanju.coexist
      ZHENGUOJIAN_DISPLAY_NAME: 小果影視-共存版
      ZHENGUOJIAN_LATIN_NAME: XiaoGuo
      EXPECTED_CERT_SHA256: 78cf3a09001eba2c5b8e7b169d2af15301e76bf5c442af00c4031120dcb1fd6a
    steps:
      - uses: actions/checkout@v4

      - name: Verify requested provider modules and Flutter channel settings
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version: 1.0.10+110' pubspec.yaml
          grep -Fq 'CheckboxListTile(' lib/ui/terms_page.dart
          grep -Fq 'fontSize: 32' lib/ui/widgets/source_bar.dart
          grep -Fq 'switches[site.id] = value' lib/local_store.dart
          grep -Fq 'for (final source in store.sources)' lib/ui/explore/source_actions.dart
          grep -Fq 'target = filepath.Clean(resolved)' native/core/app_storage.go
          test -f native/core/custom_registry_sources.go
          test -f native/sources_custom/flavor_zhenguojian.go
          test -f native/sources_legacy109/provider_web.go
          ! test -e native/sources_legacy109/flavor_zhenguojian.go
          grep -Fq 'sourceLujj31' native/core/custom_registry_sources.go
          grep -Fq 'sourceLiuguo' native/core/custom_registry_sources.go
          grep -Fq 'sourceXiaoguo' native/core/custom_registry_sources.go
          echo '13 registered additional provider IDs, reconstructed 109 originals as fallback; this does NOT guarantee original full 110 source parity.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
          accept-android-sdk-licenses: true
      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          version=28.2.13676358
          if [ ! -f "$ANDROID_HOME/ndk/$version/source.properties" ]; then
            sdkmanager --sdk_root="$ANDROID_HOME" "ndk;$version"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache: false
      - name: Run native provider tests and build both experimental ABIs
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from app_build import link_sources
          from pathlib import Path
          link_sources([Path('native/sources_custom'), Path('native/sources_legacy109')])
          PY
          (cd native && go test -tags=zhenguojian -count=1 ./core guoapp/legacy109-recovery duanjuapp/native/sources_custom) 2>&1 | tee "$RUNNER_TEMP/guo-110-provider-tests.log"
          python3 scripts/build_native.py --platform android --all-sources \
            --sources native/sources_custom --sources native/sources_legacy109 \
            --abi arm64-v8a --abi armeabi-v7a 2>&1 | tee "$RUNNER_TEMP/guo-110-native-build.log"
          python3 - <<'PY'
          import pathlib, hashlib
          for abi in ('arm64-v8a','armeabi-v7a'):
              path=pathlib.Path('android/app/src/main/jniLibs')/abi/'libduanju_core.so'
              if not path.is_file() or path.stat().st_size < 1_000_000:
                  raise SystemExit('New native Go library missing: '+str(path))
              sha=hashlib.sha256(path.read_bytes()).hexdigest()
              pathlib.Path('/tmp/guo-110-experimental-'+abi+'.sha256').write_text(sha+'\n')
              print('Native library compiled with original-reconstruction + 13 additional providers:',abi,sha)
          PY

      - name: Load previously configured permanent signing certificate
        shell: bash
        env:
          ORIGINAL_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$ORIGINAL_KEY" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            [ -n "$value" ] || { echo "::error::Original permanent signing secret missing"; exit 1; }
          done
          umask 077
          printf '%s' "$ORIGINAL_KEY" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/guo-110-permanent.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/guo-110-permanent.jks" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/guo-110-permanent.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/guo-110-cert.txt"
          actual=$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/guo-110-cert.txt" | head -n1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          [ "$actual" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::Permanent certificate fingerprint mismatch"; exit 1; }

      - name: Verify Flutter authorization checkbox source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart format lib/ui/terms_page.dart

      - name: Package 110 Flutter coexist APKs with newly built 13-provider core
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi --no-pub \
            --target-platform android-arm64,android-arm \
            --dart-define=APP_FLAVOR=zhenguojian \
            --dart-define=ZHENGUOJIAN_DISPLAY_NAME=小果影視-共存版 \
            --dart-define=ZHENGUOJIAN_LATIN_NAME=XiaoGuo \
            2>&1 | tee "$RUNNER_TEMP/guo-110-build.log"
          python3 scripts/package_release.py --platform android --all-sources \
            --abi arm64-v8a --abi armeabi-v7a

      - name: Verify permanently signed experimental APKs contain rebuilt Go cores
        shell: bash
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          test -n "$signer" && test -n "$aapt"
          mkdir -p verified
          for abi in arm64-v8a armeabi-v7a; do
            apk="dist/android/zhenguojian-1.0.10+110-$abi.apk"
            test -s "$apk" || { echo "::error::Missing $abi APK"; exit 1; }
            "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/guo-110-apk-cert.txt"
            digest=$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/guo-110-apk-cert.txt" | awk '{print $NF}' | tr -d ': ' | tr '[:upper:]' '[:lower:]')
            [ "$digest" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::Wrong APK signer"; exit 1; }
            "$aapt" dump badging "$apk" | grep -F "package: name='com.duanju.coexist'"
            "$aapt" dump badging "$apk" | grep -F "versionName='1.0.10'"
            python3 - "$apk" "$abi" <<'PY'
          import hashlib, pathlib, sys, zipfile
          apk, abi = sys.argv[1:]
          expected = pathlib.Path('/tmp/guo-110-experimental-'+abi+'.sha256').read_text().strip()
          with zipfile.ZipFile(apk) as archive:
              for library in ('libduanju_core.so','libflutter.so','libapp.so','libmpv.so','libffmpegkit.so'):
                  name=f'lib/{abi}/{library}'
                  if name not in archive.namelist():
                      raise SystemExit('Missing '+name)
              binary=archive.read(f'lib/{abi}/libduanju_core.so')
              actual=hashlib.sha256(binary).hexdigest()
              if actual!=expected:
                  raise SystemExit(f'Experimental 110 provider core unexpectedly replaced {abi}: {actual} != {expected}')
              print(f'{abi}: rebuilt experimental source core {actual}')
          PY
            cp "$apk" verified/
          done
          (cd verified && sha256sum *.apk > SHA256SUMS.txt)
          echo "Experimental 13 additional providers and reconstructed 109 baseline compiled in Go; original full 110 private provider parity NOT guaranteed. Permanent certificate verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload both APKs to Actions artifacts only
        uses: actions/upload-artifact@v4
        with:
          name: guo-110-coexist-13-providers-EXPERIMENTAL-arm64-v7a
          path: verified/*
          retention-days: 14
          if-no-files-found: error

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guo-110-13-provider-build-diagnostics
          path: |
            ${{ runner.temp }}/guo-110-build.log
            ${{ runner.temp }}/guo-110-native-build.log
            ${{ runner.temp }}/guo-110-provider-tests.log
          retention-days: 14
          if-no-files-found: warn

      - name: Delete temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/guo-110-permanent.jks" "$RUNNER_TEMP/guo-110-cert.txt" "$RUNNER_TEMP/guo-110-apk-cert.txt"
