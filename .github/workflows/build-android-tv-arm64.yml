name: Build guo Android TV 11 ARMv7 and ARM64

on:
  push:
    branches: [tv/xanerix-meiguo-1.0.4-104-20261107]
    paths:
      - .github/workflows/build-android-tv-arm64.yml
      - lib/**
      - native/**
      - android/**
      - pubspec.yaml
      - pubspec.lock
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-guo-tv-dualabi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Restore fixed coexist signing
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEY" || { echo "::error::Missing original coexist signing key"; exit 1; }
          printf '%s' "$KEY" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Static analysis
        run: dart analyze --fatal-infos lib
      - name: Core tests
        run: |
          flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
          (cd native && go test ./...)
      - name: Build native libraries for both TV ABIs
        run: python scripts/build_native.py --platform android --abi armeabi-v7a --abi arm64-v8a --all-sources
      - name: Build Android TV 11 APKs for both ABIs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --no-pub --dart-define=ALL_SOURCES=true --dart-define=TV_BUILD=true
      - name: Validate TV 11 APK package, ABI, Leanback launcher, and signer
        run: |
          set -euo pipefail
          mkdir -p dist/coexist
          for abi in armeabi-v7a arm64-v8a; do
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -s "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > "apk-${abi}-badging.txt"
            grep -Fq "package: name='com.duanju.duanju_app.coexist.tv'" "apk-${abi}-badging.txt"
            if [ "$abi" = "armeabi-v7a" ]; then
              grep -Fq "versionCode='1115'" "apk-${abi}-badging.txt"
            else
              grep -Fq "versionCode='2115'" "apk-${abi}-badging.txt"
            fi
            grep -Fq "versionName='1.0.4+104coexist-TV11'" "apk-${abi}-badging.txt"
            grep -Fq "native-code: '${abi}'" "apk-${abi}-badging.txt"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > "tv-${abi}-manifest.txt"
            grep -q 'LEANBACK_LAUNCHER' "tv-${abi}-manifest.txt"
            grep -q 'banner' "tv-${abi}-manifest.txt"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "cert-${abi}.txt"
            grep -Fqi '78cf3a09001eba2c5b8e7b169d2af15301e76bf5c442af00c4031120dcb1fd6a' "cert-${abi}.txt"
            unzip -l "$apk" | grep -Fq "lib/${abi}/libduanju_core.so"
            cp "$apk" "dist/coexist/zhenguojian-androidTV11-1.0.4+104coexist-meiguo-fix-${abi}.apk"
          done
          sha256sum dist/coexist/*.apk > dist/coexist/SHA256SUMS-androidTV11-dualabi.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-androidTV11-1.0.4-104-meiguo-fix-dualabi
          path: dist/coexist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish both Android TV 11 architectures to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view coexist-v1.0.4-104 --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload coexist-v1.0.4-104 \
            "dist/coexist/zhenguojian-androidTV11-1.0.4+104coexist-meiguo-fix-armeabi-v7a.apk" \
            "dist/coexist/zhenguojian-androidTV11-1.0.4+104coexist-meiguo-fix-arm64-v8a.apk" \
            "dist/coexist/SHA256SUMS-androidTV11-dualabi.txt" \
            --repo "$GITHUB_REPOSITORY"
