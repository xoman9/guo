name: Test nine official JS modules coexist APKs
# Build the official Hongguo v1.0.2 plus the eight existing JS modules after tests.
on:
  push:
    branches: [feat/official-js-modules-20261116]
    paths:
      - '.github/workflows/build-eight-js-apk.yml'
      - 'lib/source_catalog.dart'
      - 'test/source_catalog_test.dart'
      - 'lib/global_search.dart'
      - 'lib/ui/search/search_page.dart'
      - 'test/global_search_test.dart'
      - 'lib/ui/player/danmaku_overlay.dart'
      - 'test/danmaku_emoji_test.dart'
      - 'native/core/bundled/hongguo/**'
      - 'native/core/official_hongguo_playback_test.go'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Build the newest main revision; superseded runs should not block APKs.
  group: guo-nine-official-js-modules
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      ZHENGUOJIAN_PACKAGE_NAME: com.duanju.coexist
      ZHENGUOJIAN_DISPLAY_NAME: 小果影視-共存版
      ZHENGUOJIAN_LATIN_NAME: XiaoGuo
      EXPECTED_CERT_SHA256: 78cf3a09001eba2c5b8e7b169d2af15301e76bf5c442af00c4031120dcb1fd6a
    steps:
      - uses: actions/checkout@v4

      - name: Verify requested provider modules and Flutter channel settings
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version: 1.0.10+110' pubspec.yaml
          grep -Fq 'CheckboxListTile(' lib/ui/terms_page.dart
          grep -Fq 'fontSize: 32' lib/ui/widgets/source_bar.dart
          grep -Fq 'switches[site.id] = value' lib/local_store.dart
          grep -Fq 'for (final source in store.sources)' lib/ui/explore/source_actions.dart
          grep -Fq 'target = filepath.Clean(resolved)' native/core/app_storage.go
          test -f native/core/custom_registry_sources.go
          test -f native/sources_custom/flavor_zhenguojian.go
          test -f native/sources_original110/provider_hongguo_provider.go
          test -f native/sources_original110/provider_hongguo_native_media.go
          test -f native/sources_original110/flavor_zhenguojian.go
          test -f native/sources_original110/go.mod
          test -f native/sources_missav110/provider.go
          ! test -f native/sources_missav110/flavor_zhenguojian.go
          grep -Fq '"hongguo"' native/sources_original110/flavor_zhenguojian.go
          grep -Fq 'sourceLujj31' native/core/custom_registry_sources.go
          grep -Fq 'sourceLiuguo' native/core/custom_registry_sources.go
          grep -Fq 'sourceXiaoguo' native/core/custom_registry_sources.go
          grep -Fq '"hongguo"' native/core/official_js_modules.go
          grep -Fq '"version": "1.0.2"' native/core/bundled/hongguo/manifest.json
          python3 scripts/verify_js_modules.py
          echo 'Feature branch build: Hongguo official JS v1.0.2 plus eight JS v1.0.1 modules; preserve other providers.' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
          accept-android-sdk-licenses: true
      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          version=28.2.13676358
          if [ ! -f "$ANDROID_HOME/ndk/$version/source.properties" ]; then
            sdkmanager --sdk_root="$ANDROID_HOME" "ndk;$version"
          fi

      - name: Verify Flutter regressions before native and APK builds
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter test test/danmaku_emoji_test.dart
          flutter test test/tvbox_js_source_test.dart
          flutter test test/source_catalog_test.dart test/explore_feed_test.dart test/global_search_test.dart
          # Source / playback changes require the existing regression tests to pass.
          dart format --output=none lib/ui/terms_page.dart lib/ui/player/danmaku_overlay.dart lib/ui/player/playback_page.dart test/danmaku_emoji_test.dart

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Run native provider tests and build ARM64 experimental core only
        shell: bash
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from app_build import link_sources
          from pathlib import Path
          link_sources([Path('native/sources_original110'), Path('native/sources_missav110')])
          PY
          (cd native && go test -tags=zhenguojian -count=1 ./core ./bridge duanjuapp/native/sources_original110 guoapp/missav-recovery) 2>&1 | tee "$RUNNER_TEMP/guo-110-provider-tests.log"
          python3 scripts/build_native.py --platform android --all-sources \
            --sources native/sources_original110 --sources native/sources_missav110 \
            --abi arm64-v8a 2>&1 | tee "$RUNNER_TEMP/guo-110-native-build.log"
          python3 - <<'PY'
          import pathlib, hashlib
          for abi in ('arm64-v8a',):
              path=pathlib.Path('android/app/src/main/jniLibs')/abi/'libduanju_core.so'
              if not path.is_file() or path.stat().st_size < 1_000_000:
                  raise SystemExit('New native Go library missing: '+str(path))
              sha=hashlib.sha256(path.read_bytes()).hexdigest()
              pathlib.Path('/tmp/guo-110-experimental-'+abi+'.sha256').write_text(sha+'\n')
              print('Single Go core compiled with historical original 15 + rebuilt MissAV + 13 additional providers:',abi,sha)
          PY

      - name: Load previously configured permanent signing certificate
        shell: bash
        env:
          ORIGINAL_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$ORIGINAL_KEY" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            [ -n "$value" ] || { echo "::error::Original permanent signing secret missing"; exit 1; }
          done
          umask 077
          printf '%s' "$ORIGINAL_KEY" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/guo-110-permanent.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/guo-110-permanent.jks" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/guo-110-permanent.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/guo-110-cert.txt"
          actual=$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/guo-110-cert.txt" | head -n1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          [ "$actual" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::Permanent certificate fingerprint mismatch"; exit 1; }

      - name: Package ARM64 Flutter coexist APK with nine JS providers
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi --no-pub \
            --target-platform android-arm64 \
            --dart-define=APP_FLAVOR=zhenguojian \
            --dart-define=ZHENGUOJIAN_DISPLAY_NAME=小果影視-共存版 \
            --dart-define=ZHENGUOJIAN_LATIN_NAME=XiaoGuo \
            2>&1 | tee "$RUNNER_TEMP/guo-110-build.log"
          python3 scripts/package_release.py --platform android --all-sources \
            --abi arm64-v8a

      - name: Verify permanently signed ARM64 APK contains rebuilt Go core
        shell: bash
        run: |
          set -euo pipefail
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          test -n "$signer" && test -n "$aapt"
          mkdir -p verified
          for abi in arm64-v8a; do
            apk="dist/android/zhenguojian-1.0.10+110-$abi.apk"
            test -s "$apk" || { echo "::error::Missing $abi APK"; exit 1; }
            "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/guo-110-apk-cert.txt"
            digest=$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/guo-110-apk-cert.txt" | awk '{print $NF}' | tr -d ': ' | tr '[:upper:]' '[:lower:]')
            [ "$digest" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::Wrong APK signer"; exit 1; }
            "$aapt" dump badging "$apk" | grep -F "package: name='com.duanju.coexist'"
            "$aapt" dump badging "$apk" | grep -F "versionName='1.0.10'"
            python3 - "$apk" "$abi" <<'PY'
          import hashlib, pathlib, sys, zipfile
          apk, abi = sys.argv[1:]
          expected = pathlib.Path('/tmp/guo-110-experimental-'+abi+'.sha256').read_text().strip()
          with zipfile.ZipFile(apk) as archive:
              for library in ('libduanju_core.so','libflutter.so','libapp.so','libmpv.so','libffmpegkit.so'):
                  name=f'lib/{abi}/{library}'
                  if name not in archive.namelist():
                      raise SystemExit('Missing '+name)
              binary=archive.read(f'lib/{abi}/libduanju_core.so')
              actual=hashlib.sha256(binary).hexdigest()
              if actual!=expected:
                  # Gradle strips native ELF debug symbols when packaging an APK.
                  # Exact bytes differ, so compare the embedded Go build ID
                  # to ensure the packaged .so comes from this workflow build.
                  import subprocess, tempfile
                  original = pathlib.Path('android/app/src/main/jniLibs')/abi/'libduanju_core.so'
                  with tempfile.TemporaryDirectory() as temp:
                      extracted=pathlib.Path(temp)/'libduanju_core.so'
                      extracted.write_bytes(binary)
                      def buildid(path):
                          proc=subprocess.run(['go','tool','buildid',str(path)],capture_output=True,text=True)
                          if proc.returncode!=0 or not proc.stdout.strip():
                              raise SystemExit('Unable to verify Go build ID for '+str(path)+': '+proc.stderr)
                          return proc.stdout.strip()
                      source_id=buildid(original)
                      apk_id=buildid(extracted)
                      if source_id!=apk_id:
                          raise SystemExit(f'Packaged Go Build ID mismatch for {abi}: {source_id} != {apk_id}')
                      print(f'{abi}: Go Build ID intact after Android symbol stripping; SHA256 packaged={actual}')
              else:
                  print(f'{abi}: exact Go core bytes preserved: {actual}')
          PY
            cp "$apk" verified/
          done
          (cd verified && sha256sum *.apk > SHA256SUMS.txt)
          echo "One Go core includes original 15 from public history, 13 custom providers, and a separately reconstructed experimental MissAV. Exact original 110 MissAV playback parity not verified. Permanent certificate verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ARM64-only APK to Actions artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guo-nine-js-search-ARM64-only
          path: verified/*
          retention-days: 14
          if-no-files-found: error

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guo-main-110-build-diagnostics
          path: |
            ${{ runner.temp }}/guo-110-build.log
            ${{ runner.temp }}/guo-110-native-build.log
            ${{ runner.temp }}/guo-110-provider-tests.log
          retention-days: 14
          if-no-files-found: warn

      - name: Delete temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/guo-110-permanent.jks" "$RUNNER_TEMP/guo-110-cert.txt" "$RUNNER_TEMP/guo-110-apk-cert.txt"
