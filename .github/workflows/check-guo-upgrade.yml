name: Validate latest-Release guo UI download merge migration
on:
  push:
    branches: [feat/110-download-access-channel-ui-20261114]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Validate Go, all additional providers, Dart and Flutter
        shell: bash
        run: |
          set -euo pipefail
          (cd native && go test ./...)
          python -c "import sys;sys.path.insert(0,'scripts');from app_build import link_sources;link_sources(None)"
          grep -q 'duanjuapp/native/sources_custom' native/bridge/sources_gen.go
          (cd native && go test -tags=zhenguojian ./...)
          flutter pub get --enforce-lockfile
          dart analyze --fatal-infos lib test
          flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'
          accept-android-sdk-licenses: true
      - name: Build Android ARM64 debug APK to verify Kotlin and Flutter (no publishing)
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --target-platform android-arm64 --no-pub
      - name: Confirm repeatable latest Release policy and merge support
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/repos/Xanerix/guoapp/releases/latest' GUO_UPGRADE_PLAYBOOK.md
          grep -q 'chooseMergeDirectory' android/app/src/main/kotlin/com/guoapp/MainActivity.kt
          grep -q 'chooseDownloadDirectory' android/app/src/main/kotlin/com/guoapp/MainActivity.kt
          grep -q 'MergeLocation.saveToSelectedFolder' lib/merge_queue.dart
          ! grep -q 'Icons.public_rounded' lib/ui/widgets/source_bar.dart
          grep -q 'source-adult-bulk-toggle' lib/ui/settings/sources_view.dart
          echo 'Latest stable Release replay checklist and custom features validated.' >> "$GITHUB_STEP_SUMMARY"
