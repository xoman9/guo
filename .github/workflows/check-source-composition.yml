name: Verify original plus 13 source composition guard
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-source-composition.yml
      - scripts/app_build.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Never silently ship a 13-only full-source APK
        shell: bash
        run: |
          set -euo pipefail
          if GUO_REQUIRE_OFFICIAL_SOURCES=1 python -c "import sys;sys.path.insert(0,'scripts');from app_build import link_sources;link_sources(None)" > "$RUNNER_TEMP/guard-output" 2>&1; then
            echo "::error::Full build unexpectedly allowed without 110 original sources"
            exit 1
          fi
          grep -q 'Missing original 110 source module' "$RUNNER_TEMP/guard-output"
          echo "Full release correctly blocked when original 110 module is unavailable." >> "$GITHUB_STEP_SUMMARY"
      - name: Assert original and extra module would both be linked when available
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p guoapp-sources
          printf 'module guoapp/sources\n\ngo 1.24.1\n' > guoapp-sources/go.mod
          GUO_REQUIRE_OFFICIAL_SOURCES=1 python -c "import sys;sys.path.insert(0,'scripts');from app_build import link_sources;link_sources(None)"
          grep -q '"guoapp/sources"' native/bridge/sources_gen.go
          grep -q '"duanjuapp/native/sources_custom"' native/bridge/sources_gen.go
          echo "Official+extras import generated correctly when authorized source module is present." >> "$GITHUB_STEP_SUMMARY"
          # Fixture exists only in this transient CI runner; this does not ship or invent official parsers.
