name: Build coexist ARM64 APK
on:
  push:
    branches: [coexist-arm64]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Configure signing when release secrets are available
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY" ]; then
            printf '%s' "$KEY" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No release signing secret configured; using Android test signing for this coexist APK."
          fi
      - run: flutter pub get --enforce-lockfile
      - run: python scripts/build_native.py --platform android --abi arm64-v8a --all-sources
      - name: Build coexist release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --no-pub --dart-define=ALL_SOURCES=true --dart-define=COEXIST=true
      - name: Verify package, architecture and signature
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/aapt" dump badging "$apk" | tee apk-badging.txt
          grep -q "package: name='com.xoman9.guo.coexist'" apk-badging.txt
          grep -q "application-label:'真果鉴 共存版'" apk-badging.txt
          grep -q "native-code: 'arm64-v8a'" apk-badging.txt
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist/coexist
          cp "$apk" dist/coexist/zhenguojian-coexist-arm64-v8a.apk
          sha256sum dist/coexist/*.apk > dist/coexist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-coexist-arm64-v8a
          path: dist/coexist/
          retention-days: 30
