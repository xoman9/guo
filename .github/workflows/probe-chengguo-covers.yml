name: Verify Chengguo cover image bytes
on:
  pull_request:
    paths:
      - 'scripts/probe_chengguo_covers.py'
      - '.github/workflows/probe-chengguo-covers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve and validate real cover images
        run: python scripts/probe_chengguo_covers.py
      - name: Upload proof images and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chengguo-cover-proof
          path: chengguo-cover-proof/
