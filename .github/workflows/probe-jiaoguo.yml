name: Diagnose Jiaoguo 0.2.391 source routes
on:
  pull_request:
    paths:
      - 'scripts/probe_jiaoguo.py'
      - '.github/workflows/probe-jiaoguo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_jiaoguo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jiaoguo-source-diagnostics
          path: jiaoguo-probe/
