name: Diagnose Zhenguo Caoguo provider routes
on:
  pull_request:
    paths:
      - 'scripts/probe_zhenguo_caoguo.py'
      - '.github/workflows/probe-zhenguo-caoguo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_zhenguo_caoguo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zhenguo-caoguo-probe
          path: zhenguo-caoguo-probe/
