name: Build Xanerix-based guo coexist ARM64

on:
  push:
    branches: [rebuild/xanerix-base-legacy110-20261107]
    paths:
      - .github/workflows/rebuild-xanerix-arm64.yml
      - lib/**
      - native/**
      - android/**
      - pubspec.yaml
      - pubspec.lock
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-xanerix-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Restore fixed coexist signing
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEY" || { echo "::error::Missing original coexist signing key"; exit 1; }
          printf '%s' "$KEY" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Dependencies
        run: flutter pub get --enforce-lockfile
      - name: Static analysis
        run: dart analyze --fatal-infos lib
      - name: Core tests
        run: |
          flutter test --dart-define=DISABLE_REMOTE_IMAGES=true --dart-define=ALL_SOURCES=true
          (cd native && go test ./...)
      - name: Build native library
        run: python scripts/build_native.py --platform android --abi arm64-v8a --all-sources
      - name: Build ARM64 coexist APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --no-pub --dart-define=ALL_SOURCES=true
      - name: Validate APK identity, signer, and ABI
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | tee apk-badging.txt
          grep -Fq "package: name='com.duanju.duanju_app.coexist'" apk-badging.txt
          grep -Fq "versionCode='2111'" apk-badging.txt
          grep -Fq "versionName='1.0.11'" apk-badging.txt
          grep -Fq "native-code: 'arm64-v8a'" apk-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee cert.txt
          grep -Fqi '78cf3a09001eba2c5b8e7b169d2af15301e76bf5c442af00c4031120dcb1fd6a' cert.txt
          mkdir -p dist/coexist
          cp "$apk" dist/coexist/zhenguojian-coexist-1.0.11+111-arm64-v8a.apk
          sha256sum dist/coexist/*.apk > dist/coexist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-xanerix-coexist-1.0.11-111-arm64
          path: dist/coexist/
          retention-days: 30
          if-no-files-found: error
