name: Sign verified guo ARM64 and ARMv7 APKs with original permanent JKS
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/resign-guo-test-apks-fixed-key.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  resign:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_CERT_SHA256: 78cf3a09001eba2c5b8e7b169d2af15301e76bf5c442af00c4031120dcb1fd6a
      SOURCE_COMMIT: 8e15e60b289f87829244a87933724f8501ad4060
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify unchanged source since both APKs were compiled
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$SOURCE_COMMIT" HEAD -- lib native android assets pubspec.yaml pubspec.lock scripts
          echo "Native, Flutter, Android and build scripts unchanged from successful dual-ABI APK compilation." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0'
          accept-android-sdk-licenses: true
      - name: Retrieve successfully compiled tested APKs from original build
        uses: actions/download-artifact@v4
        with:
          name: guo-110-plus-custom-ARM64-v7a-TEST-ONLY
          repository: xoman9/guo
          run-id: 43502449639
          github-token: ${{ github.token }}
          path: unsigned-input
      - name: Sign exact tested APKs with original fixed keystore
        shell: bash
        env:
          ORIGINAL_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$ORIGINAL_KEY" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            [ -n "$value" ] || { echo "::error::Original permanent key unavailable"; exit 1; }
          done
          umask 077
          printf '%s' "$ORIGINAL_KEY" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/original-signing.jks"
          keytool -list -v -keystore "$RUNNER_TEMP/original-signing.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > "$RUNNER_TEMP/cert.txt"
          key_sha=$(sed -n 's/.*SHA256: //p' "$RUNNER_TEMP/cert.txt" | head -n1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          [ "$key_sha" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::Existing JKS certificate differs from old permanent signer"; exit 1; }
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          mkdir -p verified
          shopt -s nullglob
          apks=(unsigned-input/*arm64-v8a.apk unsigned-input/*armeabi-v7a.apk)
          [ "${#apks[@]}" -eq 2 ] || { echo "::error::Two tested APKs missing"; exit 1; }
          for apk in "${apks[@]}"; do
            basename=$(basename "$apk")
            out="verified/$basename"
            "$signer" sign --ks "$RUNNER_TEMP/original-signing.jks" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$out" "$apk"
            "$signer" verify --verbose --print-certs "$out" | tee "$RUNNER_TEMP/apksigner-report.txt"
            actual=$(sed -nE 's/^[[:space:]]*Signer #[0-9]+ certificate SHA-256 digest:[[:space:]]*([0-9a-fA-F:]+).*/\\1/p' "$RUNNER_TEMP/apksigner-report.txt" | head -n1 | tr -d ': ' | tr '[:upper:]' '[:lower:]')
            [ -n "$actual" ] && [ "$actual" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::Fixed signer mismatch on $basename; actual=${actual:-missing}"; exit 1; }
            "$aapt" dump badging "$out" | grep -F "package: name='com.duanju.coexist'"
            if [[ "$basename" == *arm64-v8a.apk ]]; then abi=arm64-v8a; else abi=armeabi-v7a; fi
            for lib in libduanju_core.so libflutter.so libapp.so libmpv.so libffmpegkit.so; do
              unzip -Z1 "$out" | grep -Fx "lib/$abi/$lib"
            done
            echo "Original fixed certificate verified: $basename" >> "$GITHUB_STEP_SUMMARY"
          done
          (cd verified && sha256sum *.apk > SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/original-signing.jks" "$RUNNER_TEMP/cert.txt" "$RUNNER_TEMP/apksigner-report.txt"
          echo "Note: com.duanju.coexist cannot overwrite differently named com.duanju.duanju_app.coexist even with identical signer." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: guo-original-permanent-JKS-ARM64-v7a
          path: verified/*
          retention-days: 14
          if-no-files-found: error
