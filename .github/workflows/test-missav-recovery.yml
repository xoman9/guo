name: Verify experimental MissAV reconstruction against upstream 110
on:
  push:
    branches: [feat/recover-109-missav-20261114]
    paths: [.github/workflows/test-missav-recovery.yml, native/sources_missav/**, native/sources_legacy109/**, scripts/check_reconstructed_sources.py]
permissions:
  contents: read
jobs:
  go-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: 
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - name: Verify all 29 reconstructed and custom source IDs with Go fixtures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_reconstructed_sources.py
          # Check source parsing/formatting without silently rewriting the checkout.
          gofmt -l native/sources_missav/*.go native/sources_legacy109/*.go native/sources_custom/*.go > "$RUNNER_TEMP/gofmt-report.txt"
          if [ -s "$RUNNER_TEMP/gofmt-report.txt" ]; then
            echo "Go files awaiting gofmt (informational):"
            cat "$RUNNER_TEMP/gofmt-report.txt"
          fi
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0,"scripts")
          from app_build import link_sources
          link_sources([Path("native/sources_custom"),Path("native/sources_missav"),Path("native/sources_legacy109")])
          PY
          (cd native && go test -count=1 -tags=zhenguojian ./bridge ./core)
          (cd native && go test -count=1 -tags=zhenguojian guoapp/missav-recovery guoapp/legacy109-recovery duanjuapp/native/sources_custom)
          grep -q '"duanjuapp/native/sources_custom"' native/bridge/sources_gen.go
          grep -q '"guoapp/missav-recovery"' native/bridge/sources_gen.go
          grep -q '"guoapp/legacy109-recovery"' native/bridge/sources_gen.go
          echo "All three Provider modules and core/bridge fixture tests passed (16 reconstructed + 13 additional IDs). No live playback or Android device verification." >> "$GITHUB_STEP_SUMMARY"
