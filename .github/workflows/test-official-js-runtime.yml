name: Test official JS provider integration (no APK)
on:
  push:
    branches: [feat/official-js-modules-20261116]
    paths:
      - 'native/core/**'
      - 'native/go.mod'
      - 'native/go.sum'
      - 'scripts/app_build.py'
      - '.github/workflows/test-official-js-runtime.yml'
  workflow_dispatch:
jobs:
  goja-compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Test Go core (no APK)
        shell: bash
        run: |
          set -euo pipefail
          cd native
          go test -count=1 ./core
      - name: Check original 110 provider integration (no APK)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from app_build import link_sources
          from pathlib import Path
          link_sources([Path('native/sources_original110'), Path('native/sources_missav110')])
          PY
          cd native
          go test -tags=zhenguojian -count=1 ./core ./bridge duanjuapp/native/sources_original110 guoapp/missav-recovery
