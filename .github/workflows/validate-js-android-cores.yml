name: Validate JS Android native cores (no APK)
on:
  push:
    branches: [feat/official-js-modules-20261116]
    paths:
      - 'native/**'
      - 'scripts/app_build.py'
      - 'scripts/build_native.py'
      - '.github/workflows/validate-js-android-cores.yml'
  workflow_dispatch:
jobs:
  android-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
      - name: Install NDK
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358"
      - name: Cross-compile native cores only, after Go unit tests
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from app_build import link_sources
          link_sources([Path('native/sources_original110'), Path('native/sources_missav110')])
          PY
          (cd native && go test -tags=zhenguojian -count=1 ./core ./bridge duanjuapp/native/sources_original110 guoapp/missav-recovery)
          python3 scripts/build_native.py --platform android --all-sources --sources native/sources_original110 --sources native/sources_missav110 --abi arm64-v8a --abi armeabi-v7a
          test -s android/app/src/main/jniLibs/arm64-v8a/libduanju_core.so
          test -s android/app/src/main/jniLibs/armeabi-v7a/libduanju_core.so
          echo "Both native ABIs compiled. No APK packaged." >> "$GITHUB_STEP_SUMMARY"
